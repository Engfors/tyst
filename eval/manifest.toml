# Phase 0 test set (SPEC 12). Audio and references live OUTSIDE the repo: paths are relative to
# `clips_root` (override with the TYST_EVAL_CLIPS environment variable). Missing clips are skipped.
#
# Per clip:
#   audio       any format libsndfile reads (wav, flac, ogg, mp3); converted to 16 kHz mono
#   reference   UTF-8 text, hand-corrected transcript (punctuation/case are ignored for WER)
#   lang        dominant language, "sv" or "en"
#   lang_spans  mixed clips only: [start_s, end_s, lang] ranges, so the harness knows which
#               engine each segment should have gone to. Rough boundaries (±1 s) are fine.
#
# Categories: sv · en (incl. Swedish-accented English) · mixed (language switch between
# speakers) · sv-terms (Swedish with English technical terms inside sentences).

[settings]
clips_root = "~/tyst-eval/clips"

# Generated sets, created under clips_root by the harness itself.
[[include]]
path = "fleurs/manifest.toml"   # python -m tyst_eval fetch-fleurs
source = "fleurs"

[[include]]
path = "synth/manifest.toml"    # python -m tyst_eval synth
source = "synth"

# ---- owner clips: drop files with these names into clips_root/owner/ and edit as needed

