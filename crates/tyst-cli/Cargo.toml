[package]
name = "tyst-cli"
description = "Headless Tyst: transcribe files, live microphone test, benchmark, model management."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tyst-cli"
path = "src/main.rs"

[features]
default = ["mic", "pipewire", "macos-tap"]
mic = ["tyst-platform/mic", "tyst-runtime/mic"]
# Linux only (ignored elsewhere): microphone and system audio through PipeWire for `meeting`.
pipewire = ["tyst-platform/pipewire", "tyst-runtime/pipewire"]
# macOS only (ignored elsewhere): system audio through a Core Audio process tap.
macos-tap = ["tyst-platform/macos-tap", "tyst-runtime/macos-tap"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
env_logger.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tyst-core.workspace = true
tyst-platform.workspace = true
tyst-runtime.workspace = true
