# cargo-about configuration for THIRD_PARTY_NOTICES.md (packaging/notices/generate.sh).
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0", "Unlicense", "0BSD",
  "CC0-1.0", "MIT-0",
]
# Only what ships: no dev or build dependencies of the workspace's own crates.
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

# The WebRTC crates state no license in Cargo.toml; their COPYING is Google's BSD-3-Clause.
[webrtc-audio-processing.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "6db9d4840c6ff0fb3c37ace8e32cfd3eb6c6e759c67b4ecbee969cd8d75154a9"

[webrtc-audio-processing-config.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-config.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"

[webrtc-audio-processing-sys.clarify]
license = "BSD-3-Clause"
