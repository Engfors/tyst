name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps (ALSA, PipeWire, WebKitGTK and tray for the app)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libpipewire-0.3-dev libspa-0.2-dev clang g++
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      # The app embeds the built UI, so it must exist before clippy and tests compile the app.
      - name: Build the UI
        run: npm ci --prefix app/ui && npm run --prefix app/ui check && npm run --prefix app/ui build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Model-dependent tests skip themselves: models are not downloaded in CI.

  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libpipewire-0.3-dev libspa-0.2-dev clang g++
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix app/ui
      # linuxdeploy is itself an AppImage; runners have no FUSE 2, so it unpacks itself instead.
      - name: Bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run --prefix app/ui tauri build -- --bundles appimage
      - name: Check that programs Tyst starts get the host environment
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/linux/check-appimage-env.sh target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: tyst-appimage
          path: target/release/bundle/appimage/*.AppImage
          retention-days: 14
          compression-level: 0
