[workspace]
resolver = "3"
members = ["crates/tyst-core", "crates/tyst-platform", "crates/tyst-runtime", "crates/tyst-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Engfors/tyst"

[workspace.dependencies]
tyst-core = { path = "crates/tyst-core" }
tyst-platform = { path = "crates/tyst-platform", default-features = false }
tyst-runtime = { path = "crates/tyst-runtime" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
protobuf = "3.7"
protobuf-codegen = "3.7"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac"] }
thiserror = "2"
toml = "1"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.release]
debug = 1
